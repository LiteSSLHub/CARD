[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cot-rewriter-grpo"
version = "0.1.0"
description = "CoT Rewriter GRPO: Unified training and evaluation environment"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Core ML / RL framework (VERL base)
    "accelerate>=1.11.0",
    "codetiming",
    "datasets>=3.6.0",
    "dill",
    "hydra-core",
    "numpy<2.0.0",
    "pandas",
    "peft>=0.15.1",
    "pyarrow>=19.0.0",
    "pybind11",
    "pylatexenc",
    "ray[default]>=2.41.0",
    "torchdata",
    "tensordict>=0.8.0,<=0.9.1,!=0.9.0",
    "transformers==4.55.0",
    "wandb>=0.16.0",
    "packaging>=20.0",
    "uvicorn",
    "fastapi",
    "latex2sympy2_extended",
    "math_verify",
    "networkx>=3.0",
    "pydot>=2.0.0",
    "liger-kernel",

    # Rollout / inference engines
    "vllm>=0.7.3,<=0.8.5",
    "sglang[srt,openai]==0.4.6.post5",
    "flash-attn",
    "flashinfer-python",

    # Training-specific
    "zmq",
    "swanlab==0.7.6",
    "aiofiles==25.1.0",
    "opentelemetry-api==1.34.1",
    "opentelemetry-sdk==1.34.1",
    "opentelemetry-exporter-otlp==1.34.1",
    "cachetools==5.3.3",
    "torch-memory-saver>=0.0.5",
    "trl<=0.9.6",

    # Evaluation-specific
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "rich",
    "loguru",
    "colorlog",
    "llmlingua",
    "pebble==5.1.0",
    "deepspeed==0.16.9",
    "matplotlib",
    "seaborn",
    "graphviz>=0.20.0",

    # Utilities
    "setuptools<70",
    "ninja",
    "psutil>=5.9.0",
]

[tool.setuptools]
packages = ["utils", "inference", "inference.utils", "eval"]

[tool.setuptools.package-dir]
utils = "cot_rewriter_grpo/utils"
inference = "cot_rewriter_grpo/inference"
"inference.utils" = "cot_rewriter_grpo/inference/utils"
eval = "eval"
